# R CMD check on every push and pull request (Linux, macOS, Windows)
# Runs only when started by hand (Actions tab > R-CMD-check > Run workflow) while the repository is private.
# When the repository goes public, restore automatic runs:
#   push:
#     branches: [main, master]
#   pull_request:
on:
  workflow_dispatch:
name: R-CMD-check
permissions: read-all
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.deps }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', deps: 'all'}
          - {os: ubuntu-latest, r: 'devel', deps: 'all'}
          - {os: macos-latest, r: 'release', deps: 'all'}
          - {os: windows-latest, r: 'release', deps: 'all'}
          # as on a CRAN machine without the suggested Bioconductor packages
          - {os: ubuntu-latest, r: 'release', deps: 'hard'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
